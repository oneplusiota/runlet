name: Build APK

# Same release flow as memory.ai: push a tag like v0.3.0 and the APK is attached to a GitHub Release.
# Pushes to main and pull requests only run the tests and build, so breakage shows up without a tag.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships the Android SDK, so no setup action is needed.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :core:engine:test :core:data:testDebugUnitTest :core:platform:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME//\//-}
          cp app/build/outputs/apk/debug/app-debug.apk "runlet-${VERSION}.apk"
          echo "APK_FILE=runlet-${VERSION}.apk" >> "$GITHUB_ENV"

      # Handy for any run, including pull requests: download the APK from the run's Artifacts section.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: runlet-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Runlet ${{ github.ref_name }}
          body: |
            ## Install

            1. Download `runlet-${{ github.ref_name }}.apk` below
            2. On Android: **Settings → Apps → Special app access → Install unknown apps** → allow your browser/Files app
            3. Open the APK and tap Install

            > **Note**: This is a test build signed with a shared throwaway key, so Play Protect may warn. Choose "Install anyway". Each release installs over the previous one without losing data.
          files: runlet-${{ github.ref_name }}.apk
