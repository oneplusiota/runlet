ksp { arg('room.schemaLocation', "$projectDir/schemas") }

dependencies {
    api project(':core:engine')
    api libs.room.runtime
    api libs.room.ktx
    ksp libs.room.compiler
    testImplementation libs.junit
    testImplementation libs.kotlin.test
